# 两个版本分支在外层分配打包标识，多架构构建复用同一事实清单。
name: docker-image

on:
  push:
    branches: [main, offcial-base]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in
            main) EDITION=ent ;;
            offcial-base) EDITION=ob ;;
            *) echo '只允许打包 main 或 offcial-base'; exit 1 ;;
          esac
          test "$RUN_ATTEMPT" -lt 1000
          SEQUENCE=$((RUN_ID * 1000 + RUN_ATTEMPT))
          VERSION=$(python3 backend/scripts/package-version.py --edition "$EDITION" --sequence "$SEQUENCE" --output build-info.json)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, os; d=json.load(open("build-info.json")); f=open(os.environ["GITHUB_OUTPUT"], "a"); f.write("date=" + d["built_at"] + "\nupstream=" + d["upstream_version"] + "\n")'

      - uses: actions/upload-artifact@v4
        with:
          name: package-build-info
          path: build-info.json

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cfgxy/sub2api:${{ steps.version.outputs.tag }}
            ghcr.io/cfgxy/sub2api:${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
            UPSTREAM_VERSION=${{ steps.version.outputs.upstream }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
