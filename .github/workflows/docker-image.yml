# Automated image build: every merge (push) into main or offcial-base publishes
# ghcr.io/cfgxy/sub2api:<YYYYMMDD-N> plus the moving tag named after the source
# branch (github.ref_name), so main and offcial-base never overwrite each
# other's moving tag. <YYYYMMDD-N> shares one daily sequence across both
# branches; N increments per day based on existing ghcr tags (fallback: run
# number). A single branch-agnostic concurrency group serializes builds to
# avoid tag-sequence races.
# Frontend and Go toolchain run natively on the amd64 runner
# (BUILDPLATFORM stages + CGO_ENABLED=0 cross-compile); QEMU covers the
# target-platform alpine layers only.
name: docker-image

on:
  push:
    branches: [main, offcial-base]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y%m%d)
          MAXN=$(gh api "/user/packages/container/sub2api/versions?per_page=100" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null \
            | grep -E "^${DATE}-[0-9]+$" | cut -d- -f2 | sort -n | tail -1)
          if [ -z "${MAXN}" ]; then N=${{ github.run_number }}; else N=$((MAXN+1)); fi
          echo "tag=${DATE}-${N}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cfgxy/sub2api:${{ steps.version.outputs.tag }}
            ghcr.io/cfgxy/sub2api:${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
