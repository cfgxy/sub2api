# One-shot ops workflow (SHAN-435): build the linux/arm64 image of this
# branch's tree and push it to ghcr.io so aws-sg can pull it without login.
# Frontend and Go toolchain both run natively on the amd64 runner
# (BUILDPLATFORM stages + CGO_ENABLED=0 cross-compile); QEMU only covers
# the final alpine layer steps.
name: arm64-image

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/cfgxy/sub2api:cdd7937c9-arm64
          build-args: |
            VERSION=0.2.13-ob
            COMMIT=cdd7937c9
            DATE=2026-10-05T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max
