name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/tests/docker-build-sources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Check Caddy proxy CORS delegation
        run: /bin/sh deploy/test-caddyfile-cors.sh
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  docker-build-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build final image with the official CI sources
        run: |
          set -euo pipefail
          docker buildx build --load --tag sub2api:ci-build-sources \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg BUILD_SEQUENCE=1 \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            --build-arg NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            --build-arg COREPACK_NPM_REGISTRY=https://registry.npmjs.org \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg UV_INDEX_URL=https://pypi.org/simple \
            --build-arg APT_MIRROR=https://deb.debian.org/debian \
            --build-arg ALPINE_REPOSITORY=https://dl-cdn.alpinelinux.org/alpine \
            .
      - name: Verify runtime image excludes build tools and restores Alpine source
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh sub2api:ci-build-sources -ec '
            test ! -e /usr/local/go/bin/go
            ! command -v node
            ! command -v pnpm
            grep -Fxq "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" /etc/apk/repositories
            grep -Fxq "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" /etc/apk/repositories
          '

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
